# Platform rules (NeoFlow): no database containers in the app stack; MySQL
# lives on the dedicated data server and is configured via .env. Port 39021
# is from this user's assigned range 39020-39029.
services:
  api:
    build:
      context: .
      args: {VCS_REF: "${KG_RELEASE_SHA:-development}"}
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    ports:
      # Loopback by default: the platform nginx on this host is the only
      # intended client; override KG_PUBLISH_BIND=0.0.0.0 only deliberately.
      - "${KG_PUBLISH_BIND:-127.0.0.1}:${KG_PUBLISH_PORT:-39021}:39021"
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:39021/api/ready', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    restart: unless-stopped
    mem_limit: 768m
    cpus: 2.0
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  worker:
    profiles: ["background"]
    build:
      context: .
      args: {VCS_REF: "${KG_RELEASE_SHA:-development}"}
    command: ["python", "-m", "app.worker"]
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    restart: unless-stopped
    mem_limit: 768m
    cpus: 1.0
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}

  watcher:
    profiles: ["background"]
    build:
      context: .
      args: {VCS_REF: "${KG_RELEASE_SHA:-development}"}
    command: ["python", "-m", "app.watcher"]
    env_file: .env
    environment:
      TZ: ${TZ:-Asia/Shanghai}
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=128m
    restart: unless-stopped
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 128
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
